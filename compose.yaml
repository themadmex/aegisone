# Local development and self-host reference. Development passwords only.
name: aegisone

services:
  db:
    image: postgres:17.6-bookworm
    environment:
      POSTGRES_PASSWORD: postgres_superuser_dev
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init-roles.sql:/docker-entrypoint-initdb.d/00-init-roles.sql:ro
    ports:
      - "127.0.0.1:${AEGIS_DB_HOST_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aegisone"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    build: .
    command: ["python", "manage.py", "migrate", "--noinput"]
    environment: &app-env
      DJANGO_DEBUG: "1"
      DJANGO_SECRET_KEY: dev-only-change-me
      DB_HOST: db
      DB_PORT: "5432"
      DB_APP_ROLE: aegis_app
      DB_USER: aegis_app
      DB_PASSWORD: aegis_app_dev
      APP_BASE_URL: http://localhost:${AEGIS_WEB_HOST_PORT:-8000}
      DJANGO_DB_ROLE: owner
      DB_OWNER_USER: aegis_owner
      DB_OWNER_PASSWORD: aegis_owner_dev
    depends_on:
      db:
        condition: service_healthy

  web:
    build: .
    environment:
      <<: *app-env
      DJANGO_DB_ROLE: app
      PUBLIC_LANDING_ENABLED: ${AEGIS_PUBLIC_LANDING_ENABLED:-0}
      DB_OWNER_USER: ""
      DB_OWNER_PASSWORD: ""
    ports:
      - "127.0.0.1:${AEGIS_WEB_HOST_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
