[project]
name = "aegisone-open"
version = "0.1.0.dev0"
description = "AegisOne Open: plain-English security self-assessment and action planning for small businesses."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "Django==5.2.19",
    "psycopg[binary]==3.3.9",
    "argon2-cffi==25.1.0",
    "django-otp==1.7.5",
    "segno==1.6.6",
    "django-ratelimit==4.1.0",
    "whitenoise==6.12.0",
    "gunicorn==27.0.1",
    "dnspython==2.9.2",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "pytest-django==4.14.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "aegisone.settings_test"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = [
    "error::RuntimeWarning",
    # collectstatic isn't run for tests; WhiteNoise only notes the empty STATIC_ROOT.
    "ignore:No directory at:UserWarning",
]
